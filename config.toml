# Konfiguracja filtra przetargów dla 3DK Projekt (Kraków / Nowy Sącz).

[fetch]
# Ile dni wstecz pobierać przy każdym uruchomieniu.
days_back = 3
# Ile dni historii ogłoszeń o wyniku trzymać do porównań cen.
history_days = 365
# Przerwa między zapytaniami (s). WAF e-Zamówień blokuje IP po zbyt wielu szybkich zapytaniach.
request_delay = 5

# Kody CPV, o które pytamy API BZP (filtr po stronie serwera, dokładny kod).
cpv_codes = [
  "71000000-8", # usługi architektoniczne, budowlane, inżynieryjne i kontrolne
  "71200000-0", # usługi architektoniczne i podobne
  "71210000-3", # doradcze usługi architektoniczne
  "71220000-6", # usługi projektowania architektonicznego
  "71221000-3", # usługi architektoniczne w zakresie obiektów budowlanych
  "71222000-0", # usługi architektoniczne w zakresie obiektów zewnętrznych
  "71223000-7", # usługi architektoniczne w zakresie rozbudowy budynków
  "71230000-9", # organizacja architektonicznych konkursów projektowych
  "71240000-2", # usługi architektoniczne, inżynieryjne i planowania
  "71242000-6", # przygotowanie przedsięwzięcia i projektu, oszacowanie kosztów
  "71248000-8", # nadzór nad projektem i dokumentacją
  "71250000-5", # usługi architektoniczne, inżynieryjne i pomiarowe
  "71320000-7", # usługi inżynieryjne w zakresie projektowania
  "71400000-2", # usługi urbanistyczne i architektury krajobrazu
  "71420000-8", # usługi architektury krajobrazu
  "79932000-6", # usługi projektowania wnętrz
]

# Węższa lista dla ogłoszeń o wyniku (ceny) – bez ogólnych kodów, które dają setki
# ogłoszeń inżynieryjnych i szybko wyczerpują limit WAF.
result_cpv_codes = [
  "71200000-0", "71210000-3", "71220000-6", "71221000-3", "71222000-0",
  "71223000-7", "71230000-9", "71248000-8", "71400000-2", "79932000-6",
]

