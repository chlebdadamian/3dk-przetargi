[fetch.rss]
# Kanały RSS serwisów przetargowych gmin: adres -> zamawiający i miejscowość.
"https://przetargi.myslenice.pl/feed/" = { org = "Gmina Myślenice", city = "Myślenice" }
"https://imeriweb.um.krakow.pl/app-pub-szp/rss" = { org = "Urząd Miasta Krakowa", city = "Kraków" }
"https://www.bip.krakow.pl/feeds/rss/komunikatynowe/238999" = { org = "Miejskie jednostki Krakowa (do 170 tys. zł)", city = "Kraków" }
"https://www.bip.krakow.pl/feeds/rss/komunikatynowe/239005" = { org = "Miejskie jednostki Krakowa (powyżej 170 tys. zł)", city = "Kraków" }

[fetch.marketplanet]
# Wyszukiwarka oneplace.marketplanet.pl (ezamawiajacy.pl): każda fraza = do 3 stron po 12 wyników.
queries = ["dokumentacji projektowej", "projekt", "koncepcji", "nadzór autorski"]

[fetch.pz.organizers]
# Profile zamawiających (https://platformazakupowa.pl/pn/{nazwa}) – każdy = 1 zapytanie (15 min).
nowysacz = { name = "Urząd Miasta Nowego Sącza", city = "Nowy Sącz" }
krynica_zdroj = { name = "Urząd Miejski w Krynicy-Zdroju", city = "Krynica-Zdrój" }

[fetch.pz]
# Frazy dla wyszukiwarki platformazakupowa.pl (każda = 1 zapytanie, 15 min przerwy).
queries = ["projekt", "dokumentacji projektowej", "koncepcji", "nadzór autorski"]

[filter]
# Ogłoszenie trafia do oceny, jeśli zbierze co najmniej tyle punktów.
min_score = 5
content_groups = ["specjalnosc", "budynek"]

# Tylko usługi (projekty to usługi; roboty budowlane i dostawy odpadają).
order_types = ["Services"]

# Przedmiot musi dotyczyć projektowania – inaczej to robota budowlana z błędnym CPV.
# Nie samo „projekt”: w Bazie Konkurencyjności każde ogłoszenie mówi o „projekcie” unijnym.
require_any = [
  "projektow", "projektów", "projektant", "projekty budowl", "projekty architekt", "projekty wnętrz",
  "projekt budynk", "projektu budynk", "projekt obiekt", "projektu obiekt", "projekt dom", "projektu dom",
  "projekt budowl", "projektu budowl", "projekt architekt",
  "projektu architekt", "projekt wnętrz", "projektu wnętrz", "projekt wykonaw", "projektu wykonaw",
  "projekt techniczn", "projektu techniczn", "projekt elewacj", "projektu elewacj",
  "projekt przebudow", "projektu przebudow", "projekt rozbudow", "projektu rozbudow",
  "projekt termomodern", "projektu termomodern", "projekt adaptacj", "projektu adaptacj",
  "dokumentacj", "koncepcj", "nadzór autorski", "nadzoru autorskiego",
  "nadzorów autorskich", "inwentaryzacj", "wizualizacj", "program funkcjonalno",
]

# Odrzucamy, jeśli przedmiot zawiera którekolwiek z tych słów (małe litery, fragmenty).
exclude_keywords = [
  "drog", "ulic", "chodnik", "most", "wiadukt", "rondo", "skrzyżowan", "ścieżk", "parking",
  "wodociąg", "kanalizac", "sieci", "oczyszczal", "fotowolt", "oświetleni", "kotłown",
  "pomp ciepła", "źródła ciepła", "instalacji gazow", "elektroenerget",
  "inwestora zastępczego", "inwestor zastępczy", "zrid", "dw ", "dk ", "dp ",
  "inspektora nadzoru", "inspektor nadzoru", "nadzoru inwestorskiego", "nadzór inwestorski", "zaprojektuj i wybuduj", "zaprojektowanie i wykonanie",
  "zaprojektowanie i budow", "geodezyjn", "mapy do celów", "plan ogólny", "planu ogólnego",
  "miejscowego planu", "studium", "regulacj", "potok", "rzek", "wał", "melioracj",
  "osuwisk", "rowerow", "tras ", "trasy", "urządzenia lasu", "zawiadomieni", "obwieszczeni", "wyłożeni",
]

# Punkty za województwo. Spoza listy = odrzucone.
[filter.provinces]
