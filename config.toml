  "przebudow", "rozbudow", "nadbudow", "termomodernizac", "modernizac", "remont",
  "projektu budowlan", "dokumentacji projektow", "projektowo-kosztorys", "projektowo – kosztorys",
] }

# Punkty za konkretne, architektoniczne kody CPV w ogłoszeniu.
[filter.cpv_bonus]
points = 2
codes = ["71220000", "71221000", "71223000", "79932000", "71248000", "71230000"]

# Szacunkowa wartość (jeśli podana): powyżej tej kwoty netto zlecenie jest za duże dla biura.
[filter.value]
max_value = 500000
penalty = 3
